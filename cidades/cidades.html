<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Escolha uma cidade e conheça seus espaços, atrações e paisagens.">
  <title>Cidades | Climatema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html">Climatema</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="cidades.html">Cidades</a></li>
          <li class="nav-item"><a class="nav-link" href="climas.html">Climas</a></li>
          <li class="nav-item"><a class="nav-link" href="cadastro.html">Cadastro</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-5">
    <header class="text-center mb-5">
      <h1>Escolha uma cidade</h1>
      <p class="lead text-body-secondary mb-0">Selecione um município para ver informações, espaços públicos e atrações.</p>
    </header>

    <section class="row g-4" aria-label="Cidades disponíveis">
      <div class="col-12 col-lg-4">
        <div class="list-group shadow-sm" id="listaCidades">
          <button type="button" class="list-group-item list-group-item-action active" data-cidade="americana" aria-pressed="true">Americana</button>
          <button type="button" class="list-group-item list-group-item-action" data-cidade="campinas" aria-pressed="false">Campinas</button>
          <button type="button" class="list-group-item list-group-item-action" data-cidade="nova-odessa" aria-pressed="false">Nova Odessa</button>
          <button type="button" class="list-group-item list-group-item-action" data-cidade="santa-barbara" aria-pressed="false">Santa Bárbara d'Oeste</button>
          <button type="button" class="list-group-item list-group-item-action" data-cidade="hortolandia" aria-pressed="false">Hortolândia</button>
        </div>
      </div>
      <div class="col-12 col-lg-8">
        <div id="detalhesCidade" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="border-top py-4"><div class="container text-center text-body-secondary"><small>Climatema · Cidades e clima</small></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script>
    const cidades = {
      americana: {
        nome: "Americana",
        descricao: "Americana combina áreas urbanas movimentadas com parques e espaços de convivência. A Avenida Brasil e a região central estão entre os pontos conhecidos da cidade.",
        locais: ["Praça Comendador Müller", "Parque Ecológico Municipal", "Jardim Botânico de Americana", "Avenida Brasil"],
        imagem: "img/americana-vista-aerea.jpg",
        alt: "Vista aérea de Americana",
        credito: 'Foto de <a href="https://commons.wikimedia.org/wiki/User:Sintegrity" target="_blank" rel="noopener noreferrer">Sintegrity</a>, via <a href="https://commons.wikimedia.org/wiki/File:Americana_-_Vista_a%C3%A9rea_02.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>',
        fonte: "https://www.americana.sp.gov.br/americana-index.php?a=centro-atendimento-turista-oquefazer",
        nomeFonte: "Turismo de Americana"
      },
      campinas: {
        nome: "Campinas",
        descricao: "Campinas é um importante centro urbano e cultural do interior paulista. Parques, bosques e espaços de lazer fazem parte das opções de passeio pela cidade.",
        locais: ["Parque Portugal (Lagoa do Taquaral)", "Bosque dos Jequitibás", "Praça Arautos da Paz", "Centro de Convivência Cultural"],
        imagem: "img/campinas-nova.jpg",
        alt: "Vista do centro de Campinas",
        credito: 'Foto de <a href="https://commons.wikimedia.org/wiki/User:HVL" target="_blank" rel="noopener noreferrer">HVL</a>, via <a href="https://commons.wikimedia.org/wiki/File:Vista_do_Centro_de_Campinas_SP.JPG" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a> · <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noopener noreferrer">CC BY 3.0</a>',
        fonte: "https://www.campinas.sp.gov.br/secretaria/servicos-publicos/pagina/parques-e-jardins-dpj-",
        nomeFonte: "Parques e jardins de Campinas"
      },
      "nova-odessa": {
        nome: "Nova Odessa",
        descricao: "Nova Odessa valoriza o contato com a natureza e conta com espaços voltados à preservação ambiental, à pesquisa e ao passeio ao ar livre.",
        locais: ["Jardim Botânico Plantarum", "Parque Ecológico Isidoro Bordon", "Instituto de Zootecnia", "Praça Central José Gazzetta"],
        imagem: "img/nova-odessa-nova.jpg",
        alt: "Vista urbana de Nova Odessa",
        credito: 'Foto de <a href="https://commons.wikimedia.org/wiki/User:Max_Wittmann" target="_blank" rel="noopener noreferrer">Max Wittmann</a>, via <a href="https://commons.wikimedia.org/wiki/File:Nova_Odessa_-_Sao_Paulo_Brasil%3B_Outlook.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>',
        fonte: "https://novaodessa.sp.gov.br/prefeitura/conheca-nova-odessa",
        nomeFonte: "Conheça Nova Odessa"
      },
      "santa-barbara": {
        nome: "Santa Bárbara d'Oeste",
        descricao: "Santa Bárbara d'Oeste reúne espaços de lazer, patrimônio histórico e atividades culturais. Os parques municipais são opções para passeios em família e ao ar livre.",
        locais: ["Parque dos Ipês", "Museu da Imigração", "Parque dos Jacarandás", "Centro de Memórias"],
        imagem: "img/santa-barbara-nova.jpg",
        alt: "Estação ferroviária de Santa Bárbara d'Oeste",
        credito: 'Foto de <a href="https://commons.wikimedia.org/wiki/User:Sintegrity" target="_blank" rel="noopener noreferrer">Sintegrity</a>, via <a href="https://commons.wikimedia.org/wiki/File:Santa_B%C3%A1rbara_d_Oeste_-_Esta%C3%A7%C3%A3o_Ferrovi%C3%A1ria_de_Santa_B%C3%A1rbara_d%27Oeste_13.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>',
        fonte: "https://www.santabarbara.sp.gov.br/cultura-e-turismo/",
        nomeFonte: "Cultura e turismo de Santa Bárbara"
      },
      hortolandia: {
        nome: "Hortolândia",
        descricao: "Hortolândia tem parques e áreas socioambientais que oferecem espaços para caminhada, descanso e atividades junto à natureza.",
        locais: ["Parque Socioambiental Irmã Dorothy Stang", "Parque Socioambiental Lago da Fé", "Observatório Ambiental Parque Escola (OAPE)", "Parque Chico Mendes"],
        imagem: "img/hortolandia-nova.jpg",
        alt: "Vista parcial de Hortolândia",
        credito: 'Foto de <a href="https://commons.wikimedia.org/wiki/User:LeonardoMcunha" target="_blank" rel="noopener noreferrer">LeonardoMcunha</a>, via <a href="https://commons.wikimedia.org/wiki/File:Hortol%C3%A2ndia-SP.jpg" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a> · <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a>',
        fonte: "https://www.hortolandia.sp.gov.br/parque-socioambiental-irma-dorothy-stang/",
        nomeFonte: "Parque Irmã Dorothy Stang"
      }
    };

    const painel = document.getElementById("detalhesCidade");
    const botoes = document.querySelectorAll("[data-cidade]");

    function mostrarCidade(chave) {
      const cidade = cidades[chave];
      const listaLocais = cidade.locais.map(function (local) {
        return '<li class="list-group-item">' + local + '</li>';
      }).join("");

      painel.innerHTML =
        '<article class="card shadow-sm h-100">' +
          '<img src="' + cidade.imagem + '" class="card-img-top gallery-img" alt="' + cidade.alt + '">' +
          '<div class="card-body">' +
            '<h2 class="card-title">' + cidade.nome + '</h2>' +
            '<p class="card-text">' + cidade.descricao + '</p>' +
            '<h3 class="h5 mt-4">Praças, parques e atrações</h3>' +
            '<ul class="list-group list-group-flush mb-3">' + listaLocais + '</ul>' +
            '<a class="btn btn-primary" href="' + cidade.fonte + '" target="_blank" rel="noopener noreferrer">Saiba mais</a>' +
            '<p class="small text-body-secondary mt-3 mb-0">Imagem: ' + cidade.credito + '</p>' +
          '</div>' +
        '</article>';

      botoes.forEach(function (botao) {
        const selecionado = botao.dataset.cidade === chave;
        botao.classList.toggle("active", selecionado);
        botao.setAttribute("aria-pressed", selecionado ? "true" : "false");
      });
    }

    botoes.forEach(function (botao) {
      botao.addEventListener("click", function () {
        mostrarCidade(botao.dataset.cidade);
      });
    });

    mostrarCidade("americana");
  </script>
</body>
</html>
