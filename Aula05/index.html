<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./img/Logo.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <title>Destino Brotas</title>
</head>
<body>
    <header>
<!-- Cabeçalho-->
<section id="pagina-home">
<div class="categoria">
   <img src="./img/Logo.png" alt="Logo da pousada Destino Brotas" class="logo">
    <nav class="menu-principal">
        <ul>
            <li> <a href="#">HOME</a></li>
            <li> <a href="#">SERVIÇOS</a></li>
            <li> <a href="#">GALERIA</a></li>
            <li> <a href="#">CONTATO</a></li>
        </ul>
    </nav>
</div>
<div class="conteudo-banner">
    <h1>Aventura e Tranquilidade</h1>
    <div>
        <a href="#" class="btn">Assista ao Video</a>
        <a href="#" class="btn">Leia mais</a>
    </div>
</div>
</section>
</header>

<div class="galeria">
    <main class="main">
    <!-- Corpo da página-->
        <div>
        <h1>Passeios</h1>
        </div>

        <div class="fotos">
            <figure>
                <img src="./img/foto1.png" class="foto1" alt="Foto de pessoas em um bote que está em uma corrente rápida de água">
                <figcaption class="legenda">Canoagem</figcaption>
            </figure>

            <figure>
                <img src="./img/foto2.png" class="foto2" alt="Foto de duas pessoas em um quadriciculo em um rio">
                <figcaption class="legenda">Passeio Radical</figcaption>
            </figure>

            <figure>
                <img src="./img/foto3.png" class="foto3" alt="Foto de uma criança andando de costas em uma trilha">
                <figcaption class="legenda">Trilhas</figcaption>
                
            </figure>
        </div>
    </main>
</div>

<div class="valores">
    <h1>Valores</h1>

    <div class="tabela">
        <div class="P1">
            <div class="P1-1">
                <p>Passeios</p>
                <p>Canoagem</p>
                <p>Passeio Radical</p>
                <p>Trilhas</p>
            </div>
            <div class="P1-2">
                <p>Valores</p>
                <p>R$ 60,00</p>
                <p>R$ 80,00</p>
                <p>R$ 90,00</p>
            </div>
        </div>

        <div class="P2">
            <p>Consulte na recepção os valores atualizados</p>
        </div>
    </div>

</div>


    <footer>

    </footer>
